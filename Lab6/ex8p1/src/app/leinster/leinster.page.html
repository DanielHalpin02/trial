<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Leinster</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Leinster</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-img
    width="200"
    height="150"
    src="https://upload.wikimedia.org/wikipedia/commons/8/8d/Flag_of_Leinster.svg">
  </ion-img>

  <ion-button (click)="onClick()">Go To Counties</ion-button>
</ion-content>
