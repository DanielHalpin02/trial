<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Munster</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Munster</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-img
    width="200"
    height="150"
    src="https://upload.wikimedia.org/wikipedia/commons/7/7d/Flag_of_Munster.svg">
  </ion-img>
</ion-content>
